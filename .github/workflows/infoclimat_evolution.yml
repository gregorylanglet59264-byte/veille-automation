name: Infoclimat Evolution & Previsions

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Mode test (envoyer uniquement a Gregory)"
        required: false
        type: boolean
        default: true
      triggered_by:
        description: "Declenche par (gregory ou patrick)"
        required: false
        type: string
        default: 'gregory'

jobs:
  run-infoclimat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restaurer l'historique des bulletins
        uses: actions/cache@v4
        with:
          path: |
            history
            history_hdf
            data
          key: infoclimat-history-${{ github.run_id }}
          restore-keys: |
            infoclimat-history-

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer l'analyse Infoclimat
        env:
          PYTHONUNBUFFERED: "1"
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL || 'langlet.gregory@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Envoi dynamique selon l'expediteur
          RECIPIENT_EMAILS: ${{ (github.event.inputs.triggered_by == 'patrick') && (secrets.RECIPIENT_EMAILS_PROD || 'patrick.marliere@wanadoo.fr, gregory.langlet@sfr.fr, langlet.gregory@gmail.com') || (secrets.RECIPIENT_EMAILS || 'gregory.langlet@sfr.fr, langlet.gregory@gmail.com') }}
        run: |
          python run_infoclimat.py
          python scripts/meteo_marine_tides.py || true
          python scripts/generate_bulletins_html.py || true
          python update_public_html.py || true

      - name: Déployer le site Web sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: success()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false

